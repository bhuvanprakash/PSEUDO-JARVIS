[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-executor",
    "crates/jarvis-observer",
    "crates/jarvis-llm",
    "crates/jarvis-replay",
    "crates/jarvis-scheduler",
    "crates/jarvis-suggester",
    "crates/jarvis-plugin",
    "crates/jarvis-sync",
    "crates/jarvis-server",
    "crates/jarvis-daemon",
    "crates/jarvis-cli",
    "crates/jarvis-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Bhuvan Prakash"]
repository = "https://github.com/bhuvanprakash/PSEUDO-JARVIS"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.12"
dialoguer = "0.11"
dirs = "5"
glob = "0.3"
hex = "0.4"
notify = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.13"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
toml = "0.8"
tempfile = "3"
